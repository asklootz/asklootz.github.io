name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    

  
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup
      uses: actions/setup-node@v4
      with:
        node-version: 24.13

    - name: Deploy
      run: npm run predeploy && npm run -d deploy
